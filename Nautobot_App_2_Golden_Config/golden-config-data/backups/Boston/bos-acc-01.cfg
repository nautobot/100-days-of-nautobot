!
! Sample running configuration for bos-acc-01.
!
! Pre-committed in the Golden Config expansion pack as a stand-in for what
! the GC Backup job would have produced against an SSH-reachable cEOS device.
! See Day 3 of this pack for the lab-approach context (no Containerlab here).
!
hostname bos-acc-01
!
ntp server 1.1.1.1
ntp server 8.8.8.8
!
interface Management0
   ip address 172.17.0.3/16
   no shutdown
!
interface Ethernet1
   description To bos-rtr-01 Eth1
   no switchport
!
interface Ethernet2
   description To nyc-rtr-01 Eth2
   no switchport
!
ip routing
!
end
