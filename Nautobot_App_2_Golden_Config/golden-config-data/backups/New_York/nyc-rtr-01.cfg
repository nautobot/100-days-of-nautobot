!
! Sample running configuration for nyc-rtr-01.
!
! Pre-committed in the Golden Config expansion pack as a stand-in for what
! the GC Backup job would have produced against an SSH-reachable cEOS device.
! See Day 3 of this pack for the lab-approach context (no Containerlab here).
!
hostname nyc-rtr-01
!
ntp server 1.1.1.1
ntp server 8.8.8.8
!
interface Management0
   ip address 172.17.0.2/16
   no shutdown
!
interface Ethernet1
   description To nyc-acc-01 Eth1
   no switchport
!
interface Ethernet2
   description To bos-acc-01 Eth2
   no switchport
!
ip routing
!
router bgp 65002
   router-id 172.17.0.2
   neighbor 172.17.0.5 remote-as 65001
!
end
